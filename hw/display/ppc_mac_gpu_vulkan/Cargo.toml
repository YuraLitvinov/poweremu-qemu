[package]
name = "ppc_mac_gpu_vulkan"
version = "0.2.0"
edition = "2021"

[lib]
name = "ppc_mac_gpu_vulkan"
crate-type = ["staticlib", "rlib"]

[dependencies]
ash = "0.37"
# The Rust R300 code (draw assembly, shader translators, state).  Enabled by
# meson for every build that has no C implementation of it (all but ppc).
r300 = { path = "../r300_rs", optional = true }
# The device itself (c2rust output of ppc_mac_gpu.c), x86 builds only.
ppc_mac_gpu_dev = { path = "../ppc_mac_gpu_dev", optional = true }

[features]
r300_rs = ["dep:r300"]
device_rs = ["dep:ppc_mac_gpu_dev"]

# The C types (renderer vtable, R300 draw packet, uniforms, ...) are
# generated from QEMU's own headers at build time, so a change to them
# cannot silently shift the layout this crate relies on.
[build-dependencies]
bindgen = "0.72"

[profile.release]
panic = "abort"
debug = 1

# Keep out of QEMU's own Cargo workspace (the root Cargo.toml).
[workspace]
