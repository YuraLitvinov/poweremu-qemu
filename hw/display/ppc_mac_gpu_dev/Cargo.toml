[package]
name = "ppc_mac_gpu_dev"
version = "0.2.0"
edition = "2021"
publish = false

# One static library: the device (c2rust-derived, being made safe) and the
# Vulkan renderer it uses.  hw/display/meson.build links it into QEMU.
[lib]
name = "ppc_mac_gpu_dev"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
r300 = { path = "../r300_rs" }
system = { path = "../../../rust/system" }
qom = { path = "../../../rust/qom" }
common = { path = "../../../rust/common" }
pci = { path = "../../../rust/hw/pci" }
hwcore = { path = "../../../rust/hw/core" }
pci-sys = { path = "../../../rust/bindings/pci-sys" }
hwcore-sys = { path = "../../../rust/bindings/hwcore-sys" }
qom-sys = { path = "../../../rust/bindings/qom-sys" }
migration-sys = { path = "../../../rust/bindings/migration-sys" }
util-sys = { path = "../../../rust/bindings/util-sys" }
system-sys = { path = "../../../rust/bindings/system-sys" }
display-sys = { path = "../../../rust/bindings/display-sys" }
ash = "0.37"

# The C types (renderer vtable, R300 draw packet, uniforms, ...) are
# generated from QEMU's own headers at build time, so a change to them
# cannot silently shift the layout the Vulkan code relies on.
[build-dependencies]
bindgen = "0.72"

[profile.release]
panic = "abort"
debug = 1

[workspace]
