[package]
name = "ppc_mac_gpu_dev"
version = "0.2.0"
edition = "2021"
publish = false

# One static library: the device (c2rust-derived, being made safe) and the
# Vulkan renderer it uses.  hw/display/meson.build links it into QEMU.
[lib]
name = "ppc_mac_gpu_dev"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
r300 = { path = "../r300_rs" }
c2rust-bitfields = "0.22.1"
ash = "0.37"

# The C types (renderer vtable, R300 draw packet, uniforms, ...) are
# generated from QEMU's own headers at build time, so a change to them
# cannot silently shift the layout the Vulkan code relies on.
[build-dependencies]
bindgen = "0.72"

[profile.release]
panic = "abort"
debug = 1

[workspace]
